name: Base codecs and Luce API
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-image
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-image luce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap isolated toolchains
        working-directory: luce-image
        run: python3 tools/bootstrap.py
      - name: Install independent test oracles
        working-directory: luce-image
        run: |
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r tests/requirements.txt
      - name: Test all six compiler modes
        working-directory: luce-image
        run: ./test.sh
