name: Base codecs and Luce API
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: luce-image
      - name: Read compiler pins
        id: pins
        shell: bash
        run: |
          echo "base=$(tr -d '\n' < luce-image/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(tr -d '\n' < luce-image/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "crypto=$(tr -d '\n' < luce-image/bootstrap/CRYPTO)" >> "$GITHUB_OUTPUT"
          echo "prism=$(tr -d '\n' < luce-image/bootstrap/PRISM)" >> "$GITHUB_OUTPUT"
          echo "tls=$(tr -d '\n' < luce-image/bootstrap/TLS)" >> "$GITHUB_OUTPUT"
          echo "psd=$(tr -d '\n' < luce-image/bootstrap/PSD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-crypto
          ref: ${{ steps.pins.outputs.crypto }}
          path: luce-crypto
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-prism
          ref: ${{ steps.pins.outputs.prism }}
          path: luce-prism
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-psd
          ref: ${{ steps.pins.outputs.psd }}
          path: luce-psd
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: dymokomi/luce-tls
          ref: ${{ steps.pins.outputs.tls }}
          path: luce-tls
          token: ${{ secrets.LUCE_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bootstrap isolated toolchains
        working-directory: luce-image
        run: python3 tools/bootstrap.py
      - name: Install independent test oracles
        working-directory: luce-image
        run: |
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r tests/requirements.txt
      - name: Test all six compiler modes
        working-directory: luce-image
        run: ./test.sh
