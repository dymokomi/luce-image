name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  codecs:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-image
      - id: pins
        run: |
          echo "base=$(cat luce-image/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(cat luce-image/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "crypto=$(cat luce-image/bootstrap/CRYPTO)" >> "$GITHUB_OUTPUT"
          echo "prism=$(cat luce-image/bootstrap/PRISM)" >> "$GITHUB_OUTPUT"
          echo "tls=$(cat luce-image/bootstrap/TLS)" >> "$GITHUB_OUTPUT"
          echo "psd=$(cat luce-image/bootstrap/PSD)" >> "$GITHUB_OUTPUT"
          echo "raster=$(cat luce-image/bootstrap/RASTER)" >> "$GITHUB_OUTPUT"
          echo "deflate=$(cat luce-image/bootstrap/DEFLATE)" >> "$GITHUB_OUTPUT"
          echo "png=$(cat luce-image/bootstrap/PNG)" >> "$GITHUB_OUTPUT"
          echo "jpeg=$(cat luce-image/bootstrap/JPEG)" >> "$GITHUB_OUTPUT"
          echo "tiff=$(cat luce-image/bootstrap/TIFF)" >> "$GITHUB_OUTPUT"
          echo "exr=$(cat luce-image/bootstrap/EXR)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-crypto
          ref: ${{ steps.pins.outputs.crypto }}
          path: luce-crypto
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-prism
          ref: ${{ steps.pins.outputs.prism }}
          path: luce-prism
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-tls
          ref: ${{ steps.pins.outputs.tls }}
          path: luce-tls
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-psd
          ref: ${{ steps.pins.outputs.psd }}
          path: luce-psd
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-raster
          ref: ${{ steps.pins.outputs.raster }}
          path: luce-raster
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-deflate
          ref: ${{ steps.pins.outputs.deflate }}
          path: luce-deflate
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-png
          ref: ${{ steps.pins.outputs.png }}
          path: luce-png
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-jpeg
          ref: ${{ steps.pins.outputs.jpeg }}
          path: luce-jpeg
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-tiff
          ref: ${{ steps.pins.outputs.tiff }}
          path: luce-tiff
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-exr
          ref: ${{ steps.pins.outputs.exr }}
          path: luce-exr
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Install independent codec oracles
        working-directory: luce-image
        run: |
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r tests/requirements.txt
      - name: Build pinned compilers
        working-directory: luce-image
        run: build/test-env/bin/python tools/bootstrap.py
      - name: Full codec matrix
        working-directory: luce-image
        run: ./test.sh
