name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  codecs:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-image
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-image luce
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Install independent codec oracles
        working-directory: luce-image
        run: |
          python3 -m venv build/test-env
          build/test-env/bin/python -m pip install -r tests/requirements.txt
      - name: Build the compilers
        working-directory: luce-image
        run: build/test-env/bin/python tools/bootstrap.py
      - name: Full codec matrix
        working-directory: luce-image
        run: ./test.sh
